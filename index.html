<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tablify</title>
<style>
:root{color-scheme:light dark;--bg:#0b1020;--panel:#121a2f;--text:#e5e7eb;--muted:#94a3b8;--border:#26324a;--accent:#3b82f6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
main{width:min(1150px,calc(100% - 32px));margin:auto;padding:40px 0}h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3rem)}
p{color:var(--muted)}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:20px}.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.head{padding:16px 18px;border-bottom:1px solid var(--border);font-weight:700}.body{padding:18px}
textarea{width:100%;min-height:420px;resize:vertical;background:#0f172a;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font:14px/1.5 monospace}
label{display:block;margin:12px 0 6px;color:var(--muted);font-size:.9rem;font-weight:650}
select,input,button{width:100%;min-height:42px;border-radius:9px;border:1px solid var(--border);background:#0f172a;color:var(--text);padding:8px 10px}
button{cursor:pointer;font-weight:700}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.format-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.format-btn{background:#0f172a;color:var(--text);border:1px solid var(--border);padding:9px 8px;min-height:42px}
.format-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pill{border:1px solid var(--border);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:.85rem}
.guide-box{margin-top:16px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.025);padding:14px}
.guide-box h3{margin:0 0 8px;font-size:1rem}
.guide-box ol{margin:0;padding-left:20px;color:var(--muted);line-height:1.55}
.guide-box li+li{margin-top:4px}
.guide-box strong{color:var(--text)}
.preview{margin-top:20px;max-height:460px;overflow:auto}.preview table{width:100%;border-collapse:collapse;font:13px monospace}.preview td,.preview th{border:1px solid var(--border);padding:7px 9px;text-align:left;white-space:nowrap}
.preview th{background:#18233d;position:sticky;top:0}pre{margin:0;padding:16px;background:#0f172a;min-height:100px;white-space:pre;overflow:auto;font:13px/1.5 monospace}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;border:1px solid var(--border);padding:9px 14px;border-radius:999px;opacity:0;transition:.15s}
#toast.show{opacity:1}@media(max-width:820px){.grid{grid-template-columns:1fr}textarea{min-height:280px}}
@media(prefers-color-scheme:light){:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#64748b;--border:#dbe3ef}textarea,select,input,pre{background:#f8fafc}.preview th{background:#eef4ff}}
</style>
</head>
<body>
<main>
<h1>Tablify</h1>
<p>Paste comma-separated values, one item per line, or an Excel table/range. Then copy or export it for Excel, Word, CSV, or any custom delimiter. Everything runs locally in your browser.</p>

<div class="grid">
<section class="card">
<div class="head">Input</div>
<div class="body">
<textarea id="input" spellcheck="false" placeholder="Supported input:

Comma list:
192.168.202.51:3389, 192.168.202.51:9524

Individual lines:
192.168.202.51:3389
192.168.202.51:9524

Or paste cells directly from Excel"></textarea>
<div class="stats"><span class="pill" id="count">0 entries</span><span class="pill" id="rows">0 rows</span></div>
</div>
</section>

<section class="card">
<div class="head">Output settings</div>
<div class="body">
<label>Format</label>
<div class="format-buttons" id="formatButtons" role="group" aria-label="Output format">
<button type="button" class="format-btn active" data-format="excel">Excel</button>
<button type="button" class="format-btn" data-format="word">Word</button>
<button type="button" class="format-btn" data-format="csv">CSV</button>
<button type="button" class="format-btn" data-format="custom">Custom</button>
</div>
<input type="hidden" id="format" value="excel">

<label for="columns">Columns</label>
<input id="columns" type="number" min="1" max="20" value="4">

<div id="customBox" hidden>
<label for="delimiter">Custom delimiter</label>
<input id="delimiter" value=" | " placeholder="Examples: ;  |  TAB  \t">
</div>

<label for="empty">Empty final cells</label>
<input id="empty" value="" placeholder="Leave blank, or enter N/A">

<div class="actions">
<button class="primary" id="copy">Copy</button>
<button id="download">Download</button>
</div>
<p id="hint"></p>

<div class="guide-box" id="guideBox">
  <h3 id="guideTitle">How to use in Excel</h3>
  <ol id="guideSteps"></ol>
</div>
</div>
</section>
</div>

<section class="card preview">
<div class="head">Preview</div>
<div id="tablePreview"></div>
<pre id="textPreview" hidden></pre>
</section>
</main>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const input=$("input"),format=$("format"),columns=$("columns"),delimiter=$("delimiter"),empty=$("empty"),
customBox=$("customBox"),tablePreview=$("tablePreview"),textPreview=$("textPreview"),toast=$("toast");

const hints={
excel:"Copies tab-separated values. Paste directly into Excel.",
word:"Copies a rich HTML table. Paste directly into Word.",
csv:"Exports standard CSV with quoting where needed.",
custom:"Joins each row with your delimiter. Use TAB or \\t for a tab."
};

const guides={
  excel:{
    title:"How to use in Excel",
    steps:[
      "Paste your source list into the <strong>Input</strong> box.",
      "Choose how many <strong>Columns</strong> you want.",
      "Click <strong>Excel</strong>, then click <strong>Copy</strong>.",
      "Open Excel and select the starting cell, for example <strong>A1</strong>.",
      "Press <strong>Ctrl+V</strong>. Each value will be placed into its own cell."
    ]
  },
  word:{
    title:"How to use in Word",
    steps:[
      "Paste your source list into the <strong>Input</strong> box.",
      "Choose how many <strong>Columns</strong> you want.",
      "Click <strong>Word</strong>, then click <strong>Copy</strong>.",
      "Open Word and place the cursor where the table should go.",
      "Press <strong>Ctrl+V</strong>. Word should paste a formatted table.",
      "If Word pastes plain text, use <strong>Paste → Keep Source Formatting</strong>."
    ]
  },
  csv:{
    title:"How to use CSV",
    steps:[
      "Paste your source list into the <strong>Input</strong> box.",
      "Choose the number of output <strong>Columns</strong>.",
      "Click <strong>CSV</strong>.",
      "Use <strong>Copy</strong> for comma-separated text, or <strong>Download</strong> to save an <strong>.csv</strong> file.",
      "Open the downloaded file in Excel, LibreOffice Calc, or another spreadsheet app."
    ]
  },
  custom:{
    title:"How to use Custom",
    steps:[
      "Paste your source list into the <strong>Input</strong> box.",
      "Choose the number of output <strong>Columns</strong>.",
      "Click <strong>Custom</strong> and enter your delimiter.",
      "Use values such as <strong>|</strong>, <strong>;</strong>, <strong>TAB</strong>, or <strong>\\t</strong>.",
      "Click <strong>Copy</strong> or <strong>Download</strong>."
    ]
  }
};

function parseItems(){
  // Flatten common pasted formats in left-to-right, top-to-bottom order:
  // comma/semicolon lists, individual lines, and Excel/Sheets tabular ranges.
  return input.value
    .split(/[\t\r\n,;]+/)
    .map(x=>x.trim())
    .filter(Boolean);
}
function colCount(){
  const n=parseInt(columns.value,10);
  return Number.isFinite(n)?Math.max(1,Math.min(20,n)):4;
}
function makeRows(items){
  const c=colCount(),out=[];
  for(let i=0;i<items.length;i+=c){
    const r=items.slice(i,i+c);
    while(r.length<c)r.push(empty.value);
    out.push(r);
  }
  return out;
}
function csvEscape(v){
  v=String(v??"");
  return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function customDelimiter(){
  const d=delimiter.value;
  if(d.toUpperCase()==="TAB"||d==="\\t")return "\t";
  if(d.toUpperCase()==="SPACE")return " ";
  return d;
}
function plain(rows,mode){
  if(mode==="csv")return rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  if(mode==="custom")return rows.map(r=>r.join(customDelimiter())).join("\r\n");
  return rows.map(r=>r.join("\t")).join("\r\n");
}
function escapeHtml(s){
  const d=document.createElement("div");d.textContent=s??"";return d.innerHTML;
}
function htmlTable(rows,withHeader=false){
  let h='<table style="border-collapse:collapse">';
  if(withHeader){
    h+="<tr>"+Array.from({length:colCount()},(_,i)=>`<th style="border:1px solid #777;padding:6px 10px">Column ${i+1}</th>`).join("")+"</tr>";
  }
  h+=rows.map(r=>"<tr>"+r.map(v=>`<td style="border:1px solid #777;padding:6px 10px;font-family:Calibri,Arial,sans-serif">${escapeHtml(v)}</td>`).join("")+"</tr>").join("");
  return h+"</table>";
}
function render(){
  const items=parseItems(),rows=makeRows(items),mode=format.value;
  $("count").textContent=`${items.length} ${items.length===1?"entry":"entries"}`;
  $("rows").textContent=`${rows.length} ${rows.length===1?"row":"rows"}`;
  $("hint").textContent=hints[mode];
  const guide=guides[mode];
  $("guideTitle").textContent=guide.title;
  $("guideSteps").innerHTML=guide.steps.map(step=>`<li>${step}</li>`).join("");
  customBox.hidden=mode!=="custom";
  if(mode==="word"){
    tablePreview.hidden=false;textPreview.hidden=true;
    tablePreview.innerHTML=rows.length?htmlTable(rows,true):'<p style="padding:16px">Nothing to preview.</p>';
  }else{
    tablePreview.hidden=true;textPreview.hidden=false;
    textPreview.textContent=plain(rows,mode);
  }
}
function notify(msg){
  toast.textContent=msg;toast.classList.add("show");
  clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove("show"),1600);
}
async function copyOut(){
  const items=parseItems();if(!items.length)return notify("Paste some values first.");
  const rows=makeRows(items),mode=format.value,p=plain(rows,mode);
  try{
    if(mode==="word"&&navigator.clipboard&&window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":new Blob([htmlTable(rows)],{type:"text/html"}),
        "text/plain":new Blob([p],{type:"text/plain"})
      })]);
    }else{
      await navigator.clipboard.writeText(p);
    }
    notify(`Copied ${items.length} entries.`);
  }catch(e){
    const ta=document.createElement("textarea");ta.value=p;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
    notify("Copied.");
  }
}
function downloadOut(){
  const items=parseItems();if(!items.length)return notify("Paste some values first.");
  const rows=makeRows(items),mode=format.value;
  let content,mime,name;
  if(mode==="word"){content="<!doctype html><meta charset=utf-8>"+htmlTable(rows);mime="text/html;charset=utf-8";name="ip-table.html";}
  else if(mode==="csv"){content="\uFEFF"+plain(rows,mode);mime="text/csv;charset=utf-8";name="ip-table.csv";}
  else if(mode==="excel"){content="\uFEFF"+plain(rows,mode);mime="text/tab-separated-values;charset=utf-8";name="ip-table.tsv";}
  else{content=plain(rows,mode);mime="text/plain;charset=utf-8";name="ip-table.txt";}
  const url=URL.createObjectURL(new Blob([content],{type:mime}));
  const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500);
  notify(`Downloaded ${name}.`);
}
document.querySelectorAll(".format-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    format.value=btn.dataset.format;
    document.querySelectorAll(".format-btn").forEach(b=>{
      b.classList.toggle("active",b===btn);
      b.setAttribute("aria-pressed",b===btn ? "true" : "false");
    });
    render();
  });
});
document.querySelectorAll(".format-btn").forEach(btn=>{
  btn.setAttribute("aria-pressed",btn.classList.contains("active") ? "true" : "false");
});

[input,columns,delimiter,empty].forEach(x=>{x.addEventListener("input",render);x.addEventListener("change",render)});
$("copy").onclick=copyOut;$("download").onclick=downloadOut;render();
</script>
</body>
</html>
